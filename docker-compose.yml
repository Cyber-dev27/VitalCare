services:
  backend:
    build: ./backend
    container_name: vitalcare-backend
    ports:
      - "8083:8080"

  frontend:
    build: ./frontend
    container_name: vitalcare-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"