services:
  db:
    image: mysql:8.0
    container_name: vitalcare-db
    environment:
      MYSQL_ROOT_PASSWORD: vitalpass
      MYSQL_DATABASE: vitalcare
    volumes:
      - dbdata:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -pvitalpass --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vitalcare-backend
    ports:
      - "8083:8083"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/vitalcare?serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: vitalpass
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        CACHE_DATE: 20261006
    container_name: vitalcare-frontend
    ports:
      - "80:80"
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: vitalcare-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    restart: always

volumes:
  grafana_data:
  dbdata: